<!DOCTYPE html>
<html lang="en" class="lock"><head><meta charset="utf-8">

<title>Admin · BANNED OFFICIAL</title>
<style>
:root{--bg:#0d0809;--s1:#161012;--s2:#1f1619;--ln:#34252a;--red:#d92b33;--red2:#b2222a;--tx:#f5eeee;--mut:#a99c9e;--hd:"Bahnschrift","Arial Narrow",Impact,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--hd);text-transform:uppercase;letter-spacing:.04em;margin:0}
.btn{background:var(--red);color:#fff;border:1px solid var(--red);padding:10px 18px;border-radius:8px;font:600 14px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--red2)}.btn.o{background:none;border-color:var(--ln);color:var(--tx)}.btn.o:hover{background:var(--s2)}.btn.d{background:none;border-color:#5b1c22;color:#ff9da2}.btn.d:hover{background:#2a0f12}.btn.s{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.6;cursor:wait}
input,select,textarea{background:var(--s2);color:var(--tx);border:1px solid var(--ln);padding:10px 12px;border-radius:8px;font:15px system-ui,sans-serif;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label{display:grid;gap:5px;font-size:14px;color:var(--mut)}label span{color:var(--tx);font-weight:600}label small{color:var(--mut)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 380px at 50% -120px,#3b0f13,transparent) no-repeat}
.lc{width:min(380px,100%);background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:28px;text-align:center}
.lc img{width:72px;height:72px;border-radius:50%;border:3px solid var(--red);object-fit:cover}
.lc h1{font-size:26px;margin:14px 0 4px}.lc p{color:var(--mut);margin:0 0 18px}.lc form{display:grid;gap:12px;text-align:left}
#le{color:#ffb8bc;font-size:14px;min-height:20px;text-align:center}
/* app */
#app{--sw:240px;display:grid;grid-template-columns:var(--sw) 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.br{display:flex;align-items:center;gap:10px;font:700 17px var(--hd);letter-spacing:.05em;padding:0 8px 16px}
.br img{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);object-fit:cover}
.gt{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:14px 10px 6px}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--mut);padding:9px 10px;border-radius:8px;font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.nv:hover{background:var(--s2);color:var(--tx)}.nv.on{background:#3a1216;color:#fff;box-shadow:inset 3px 0 var(--red)}
.nv b{background:var(--s2);color:var(--mut);font-size:12px;padding:1px 8px;border-radius:20px}.nv.on b{background:var(--red);color:#fff}
.side-f{margin-top:18px;padding:12px 8px 0;border-top:1px solid var(--ln);display:grid;gap:8px}
main{padding:26px 30px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:28px}.top p{color:var(--mut);margin:4px 0 0}.acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.st{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:16px;cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.st:hover{border-color:var(--red2)}.st b{display:block;font:700 34px/1.1 var(--hd)}.st span{color:var(--mut);font-size:14px}
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:20px;margin-bottom:20px}
.panel h2{font-size:18px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.fg .w{grid-column:1/-1}
.pv{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--ln);margin-top:6px}
.it{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid var(--ln)}
.it:first-of-type{border-top:0}.it .bd{min-width:0;flex:1;display:flex;gap:12px}
.it img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.it h3{font-size:16px;text-transform:none;letter-spacing:0;font-family:inherit;font-weight:700}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.mt span{background:var(--s2);border:1px solid var(--ln);color:var(--mut);font-size:12px;padding:1px 9px;border-radius:20px;overflow-wrap:anywhere}
.tx{color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}.tm{color:#7d7073;font-size:12px}
.ba{display:flex;gap:6px;flex:none}
.empty{color:var(--mut);text-align:center;padding:26px;border:1px dashed var(--ln);border-radius:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ln);border-left:4px solid var(--red);padding:11px 18px;border-radius:8px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:860px){
#app{grid-template-columns:1fr}
aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln);padding:12px}
main{padding:20px 16px 60px}.it{flex-direction:column}.ba{width:100%}}

/* custom scrollbar (native hidden) */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
#sbp{position:fixed;top:0;left:0;right:0;height:3px;transform-origin:0 50%;transform:scaleX(0);background:var(--red);z-index:60;pointer-events:none;will-change:transform}
#sb{position:fixed;top:12px;right:2px;bottom:12px;width:16px;z-index:25;touch-action:none;opacity:.5;transition:opacity .25s;cursor:pointer}
#sb:hover,#sb.act,#sb.sc{opacity:1}
#sb:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ln);border-radius:2px}
#sbt{position:absolute;left:3px;right:3px;top:0;border-radius:8px;background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:inset 0 0 0 1px #ffffff22;cursor:grab;will-change:transform}
#sbt:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:14px;margin:-7px 0 0 -1px;border-radius:2px;background:#ffffff88}
#sb.act #sbt{cursor:grabbing}
#sbv{position:absolute;right:24px;top:0;padding:2px 8px;border-radius:6px;background:var(--red);color:#fff;font:700 12px/18px system-ui,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;will-change:transform}
#sb.act #sbv,#sb.sc #sbv{opacity:1}
@media(max-width:760px){#sb{width:12px;right:1px}#sbt{left:2px;right:2px}#sbv{right:18px}}

:root{--glow:#ff1a1a}
/* ===== LOADER ===== */
html.lock,html.lock body{overflow:hidden}
#ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 40%,#2a0508,#050507 70%);transition:opacity .6s,transform .6s,visibility 0s .6s}
#ld.out{opacity:0;visibility:hidden;transform:scale(1.08);pointer-events:none}
#ld:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 4px);pointer-events:none}
#ld:after{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,#e1060022,transparent);animation:ldscan 2.2s linear infinite;pointer-events:none}
@keyframes ldscan{to{transform:translateY(calc(100vh + 240px))}}
.ldw{position:relative;width:min(58vw,220px);aspect-ratio:1}
.ldw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ldw .ldl{position:absolute;inset:17%;width:66%;height:66%;border-radius:50%;object-fit:cover;box-shadow:0 0 40px #e1060099;border:2px solid var(--red);animation:ldpulse 1.4s ease-in-out infinite}
@keyframes ldpulse{50%{box-shadow:0 0 70px #ff1a1acc;transform:scale(1.04)}}
.ldsp{transform-origin:100px 100px;animation:ldspin 6s linear infinite}
.ldsp2{transform-origin:100px 100px;animation:ldspin 3.5s linear infinite reverse}
@keyframes ldspin{to{transform:rotate(360deg)}}
#ldp{transform:rotate(-90deg);transform-origin:100px 100px;filter:drop-shadow(0 0 6px var(--glow))}
.ldn{font-size:clamp(54px,16vw,92px);line-height:1;letter-spacing:3px;color:var(--tx);text-shadow:0 0 24px var(--glow),0 0 50px #800;font-variant-numeric:tabular-nums}
.ldn i{font-style:normal;color:var(--red);font-size:.5em;margin-left:4px}
.ldt{letter-spacing:6px;font-size:clamp(16px,4vw,22px);color:var(--red);text-shadow:0 0 12px #e1060099}
.ldbar{width:min(70vw,320px);height:4px;border-radius:4px;background:var(--ln);overflow:hidden}
.ldbar span{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#7a0000,var(--red),#ff6a3d);box-shadow:0 0 12px var(--glow)}
.lds{font:600 12px/1 system-ui,sans-serif;letter-spacing:4px;color:var(--mut);min-height:14px}
#ld.fin .ldn,#ld.fin .lds{color:#fff;text-shadow:0 0 30px var(--glow)}
#ld.fin .ldw{animation:ldflash .5s}
@keyframes ldflash{30%{filter:brightness(2.2) drop-shadow(0 0 30px #ff1a1a)}}
@media(prefers-reduced-motion:reduce){.ldsp,.ldsp2,#ld:after,.ldw .ldl{animation:none}}
/* admin flavour */
.ldk{position:absolute;right:8%;bottom:8%;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#120a0b;border:2px solid var(--red);box-shadow:0 0 16px #e1060099;z-index:2}
.ldk svg{position:static;width:17px;height:17px}
.ldk .sh{transform-origin:12px 10px;transition:transform .4s}
#ld.fin .ldk{border-color:#3ddc84;box-shadow:0 0 22px #3ddc84aa}
#ld.fin .ldk path,#ld.fin .ldk rect{stroke:#3ddc84}
#ld.fin .ldk .sh{transform:translateY(-3px) rotate(-25deg)}
#ld.fin #ldp{stroke:#3ddc84;filter:drop-shadow(0 0 6px #3ddc84)}
#ld.fin .ldn{text-shadow:0 0 30px #3ddc84}
#ld.fin .lds{color:#3ddc84;text-shadow:0 0 14px #3ddc8899}
.ldrole{font:700 11px/1 ui-monospace,Consolas,monospace;letter-spacing:5px;color:var(--mut);margin-top:-6px}
.lds{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:600;letter-spacing:2px;font-size:12px;text-align:center;padding:0 16px}
.lds:after{content:"_";animation:ldblink 1s steps(1) infinite}
@keyframes ldblink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.lds:after{animation:none}}

/* sidebar: signal rail scrollbar (native hidden) */
aside{scrollbar-width:none;-ms-overflow-style:none;--ft:0px;--fb:0px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--fb)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--fb)),transparent 100%)}
aside::-webkit-scrollbar{display:none;width:0;height:0}
#rail{position:fixed;left:calc(var(--sw,240px) - 14px);top:0;width:14px;height:100vh;z-index:26;display:none;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:22px 1px 22px 0;box-sizing:border-box;touch-action:none;cursor:ns-resize;user-select:none}
#rail.on{display:flex}
#rail i{display:block;height:2px;width:3px;border-radius:2px 0 0 2px;background:var(--ln);transition:background .15s;will-change:width}
#rail i.k{background:#5a3a40}
#rail i.w{background:#8a2f37}
#rail i.h{background:var(--red);box-shadow:0 0 8px var(--red),0 0 2px #fff6}
@media(max-width:860px){#rail{display:none!important}aside{-webkit-mask-image:none;mask-image:none}}

/* responsive */
html,body{max-width:100%;overflow-x:hidden}
.fg{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.it .bd>div{min-width:0}.it h3,.it .tx{overflow-wrap:anywhere}

@media(max-width:860px){
#app{display:block}
aside{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 12px;overflow:visible;background:rgba(22,16,18,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.br{padding:0;font-size:16px}
#mb{display:inline-flex;flex-direction:column;justify-content:center;gap:5px;width:42px;height:40px;padding:0 11px;background:var(--s2);border:1px solid var(--ln);border-radius:10px;cursor:pointer;flex:none}

.gt{display:block}
.nv{width:100%;white-space:normal;padding:12px 10px;font-size:15px;border:0;border-radius:8px}
.nv.on{box-shadow:inset 3px 0 var(--red)}
.side-f{display:flex;flex-direction:row;margin:10px 0 0;padding:12px 0 0;border-top:1px solid var(--ln)}
.side-f .btn{flex:1;text-align:center}
.top{margin-bottom:16px}.top h1{font-size:23px}
.acts{width:100%}.acts .btn{flex:1;text-align:center}
.panel{padding:16px}
.it{gap:10px}.ba .btn{flex:1;text-align:center}
}
@media(max-width:520px){
main{padding:16px 12px 56px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{padding:12px}.st b{font-size:28px}.st span{font-size:13px}
.panel{padding:14px;border-radius:10px}

.it .bd{gap:10px}.it img{width:40px;height:40px}

.lc{padding:22px 18px}
#toast{bottom:14px;width:calc(100vw - 28px);text-align:center}
}
@media(max-width:360px){.stats{grid-template-columns:1fr}.br{font-size:15px}.br img{width:28px;height:28px}}

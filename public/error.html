<style>
:root{--bg:#0d0809;--s1:#161012;--s2:#1f1619;--ln:#34252a;--red:#d92b33;--red2:#b2222a;--tx:#f5eeee;--mut:#a99c9e;--hd:"Bahnschrift","Arial Narrow",Impact,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg) radial-gradient(900px 420px at 50% -120px,#3b0f13,transparent) no-repeat;color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 4px);pointer-events:none}
body:after{content:"";position:fixed;left:0;right:0;height:140px;top:-140px;background:linear-gradient(180deg,transparent,#d92b3318,transparent);animation:scan 5s linear infinite;pointer-events:none}
@keyframes scan{to{transform:translateY(calc(100vh + 280px))}}
.wrap{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px))}
.tag{font:700 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.35em;color:var(--mut);text-transform:uppercase;padding:8px 14px;border:1px solid var(--ln);border-radius:30px;background:#161012cc;animation:up .6s both}
.code{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.4vw,14px);margin:22px 0 6px;font:700 clamp(96px,26vw,210px)/1 var(--hd);letter-spacing:.02em;animation:up .6s .08s both}
.code span{background:linear-gradient(180deg,#ff6b72 0%,#d92b33 55%,#8f1219 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px #d92b3388) drop-shadow(0 0 40px #d92b3344);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 22px #ff3b45aa) drop-shadow(0 0 52px #d92b3366)}}
.code img{height:.78em;width:.78em;aspect-ratio:1;border-radius:50%;object-fit:cover;border:clamp(3px,.9vw,6px) solid var(--red);box-shadow:0 0 0 clamp(5px,1.6vw,12px) #d92b3318,0 0 60px #d92b3355;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 clamp(5px,1.6vw,12px) #d92b3326,0 0 90px #ff1a1a88;transform:scale(1.04)}}
h1{margin:0;font:700 clamp(26px,6vw,42px)/1.15 var(--hd);text-transform:uppercase;letter-spacing:.06em;animation:up .6s .16s both}
h1:after{content:"";display:block;width:min(46vw,150px);height:3px;margin:16px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,#d92b33,transparent);box-shadow:0 0 14px #d92b3399}
p{max-width:520px;margin:18px auto 0;color:var(--mut);animation:up .6s .24s both}
.hi{color:#d9bfc2;font-size:14px;margin-top:6px}
.path{display:none;max-width:min(92vw,520px);margin:18px auto 0;padding:8px 14px;border:1px dashed var(--ln);border-radius:10px;background:#161012;font:13px/1.4 ui-monospace,Consolas,monospace;color:#ff9da2;overflow-wrap:anywhere;animation:up .6s .3s both}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px;animation:up .6s .36s both}
.btn{display:inline-block;background:var(--red);color:#fff;border:1px solid var(--red);padding:12px 24px;border-radius:10px;font:600 15px system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:background .2s,box-shadow .2s,transform .2s;touch-action:manipulation}
.btn:hover{background:var(--red2);box-shadow:0 0 22px #d92b3366;transform:translateY(-1px)}
.btn.o{background:none;border-color:var(--ln);color:var(--tx)}.btn.o:hover{background:var(--s2);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.ft{margin-top:44px;font:600 12px/1 system-ui,sans-serif;letter-spacing:.3em;color:#6f6264;text-transform:uppercase;animation:up .6s .44s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
